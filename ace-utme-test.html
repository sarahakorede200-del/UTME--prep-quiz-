 <div id="er" class="mu" style="color:var(--bad);min-height:20px"></div><button class="pri" onclick="begin()">Start Test →</button></div>`+(owner?`<div class="card"><b>Owner tools</b><p class="mu">Your tries are never added to the leaderboard.</p><button class="sec" onclick="reset()">↺ Reset my attempt</button> <button class="sec" onclick="lbOpen()">🏆 View leaderboard</button></div>`:"")+foot();
}
async function begin(){
 const n=$("#nm").value.trim(),p=$("#ph").value.replace(/[\s-]/g,"");
 if(n.length<3)return $("#er").textContent="Please enter your full name.";
 if(!/^\+?\d{10,14}$/.test(p))return $("#er").textContent="Enter a valid WhatsApp number.";
 if(db&&!owner){try{const d=await db.collection("results").doc(p).get();if(d.exists)return $("#er").textContent="This number has already taken the test."}catch(e){}}
 st={name:n,phone:p,start:Date.now(),ans:{},done:false};save();cur=0;quiz();
}
function quiz(){
 const left=TOTAL_SECS-((Date.now()-st.start)/1000|0);if(left<=0)return submit(true);
 const q=B[cur];
 app.innerHTML=`<div class="top"><div><b>${esc(st.name)}</b><div class="mu">${Object.keys(st.ans).length}/${B.length} answered</div></div><div class="tm" id="tm">${fmt(left)}</div></div>
 <div class="row" style="margin-bottom:12px;flex-wrap:wrap">${SUBS.map(s=>`<button class="${q.s==s?"pri":"sec"}" style="min-width:45%" onclick="cur=B.findIndex(x=>x.s=='${s}');quiz()">${s}</button>`).join("")}</div><div class="card"><span class="tag">${q.s}</span> <span class="mu">Question ${cur+1} of ${B.length}</span><h3>${esc(q.q)}</h3>
 ${q.o.map((o,i)=>`<button class="opt ${st.ans[cur]===i?"on":""}" onclick="pick(${i})"><b>${"ABCD"[i]}.</b> ${esc(o)}</button>`).join("")}
 <div class="row" style="margin-top:12px"><button class="sec" onclick="go(-1)" ${cur?"":"disabled"}>← Previous</button><button class="sec" onclick="go(1)" ${cur<B.length-1?"":"disabled"}>Next →</button></div></div>
 <div class="card"><div class="pal">${B.map((x,i)=>x.s!=q.s?"":`<button class="${st.ans[i]!=null?"d":""} ${i==cur?"c":""}" onclick="cur=${i};quiz()">${i+1}</button>`).join("")}</div></div>
 <div id="sb"><button class="pri" onclick="subAsk()">Submit Test</button></div>${owner?`<button class="sec" style="width:100%;margin-top:10px" onclick="reset()">↺ Reset my attempt (owner only)</button>`:""}`+foot();
 clearInterval(tick);tick=setInterval(()=>{const l=TOTAL_SECS-((Date.now()-st.start)/1000|0);const e=$("#tm");if(e)e.textContent=fmt(l);if(l<=0)submit(true)},1000);
}
const pick=i=>{st.ans[cur]=i;save();quiz()},go=d=>{cur+=d;quiz()};
function subAsk(){$("#sb").innerHTML=`<div class="card"><b>Submit now?</b><p class="mu">You answered ${Object.keys(st.ans).length} of ${B.length} questions. You cannot retake the test after submitting.</p><div class="row"><button class="sec" onclick="quiz()">Cancel</button><button class="pri" onclick="submit()">Yes, submit</button></div></div>`}
async function submit(){
 clearInterval(tick);if(st.done)return;
 let sc=0;B.forEach((q,i)=>{if(st.ans[i]===q.a)sc++});
 st.done=true;st.score=sc;st.secs=Math.min(TOTAL_SECS,(Date.now()-st.start)/1000|0);save();
 if(db&&!owner){try{await db.collection("results").doc(st.phone).set({name:st.name,phone:st.phone,score:sc,total:B.length,secs:st.secs,at:Date.now()})}catch(e){}}
 result();
}
function result(){
 const p=Math.round(st.score/B.length*100);
 app.innerHTML=head()+`<div class="card"><h2 style="text-align:center;margin-top:0">Test submitted ✅</h2>${owner?`<div class="big">${st.score}/${B.length}</div><p style="text-align:center">${p}% · Time used: <b>${fmt(st.secs)}</b></p>`:`<div class="big">🔒</div><p style="text-align:center"><b>Results are disabled.</b><br>${TITLE} will announce the results.</p>`}
 <p class="mu" style="text-align:center">${esc(st.name)} · ${esc(st.phone)}<br>Your answers have been recorded. The test cannot be retaken.</p></div>`+(owner?`<button class="sec" style="width:100%" onclick="reset()">↺ Reset my attempt (owner)</button>`:"")+foot();
}
function reset(){st=null;try{localStorage.removeItem(K)}catch(e){}cur=0;home()}
async function lbOpen(){
 if(!owner){app.innerHTML=head()+'<div class="card" style="text-align:center"><div style="font-size:40px">🔒</div><h2>Leaderboard is private</h2><p class="mu">Only the test creator can view it.</p><button class="sec" onclick="home()">← Back</button></div>';return}
 app.innerHTML=head()+`<div class="card"><h2 style="margin-top:0">🏆 Leaderboard</h2><div id="lt" class="sc mu">Loading…</div><br><button class="sec" onclick="home()">← Back</button></div>`;
 if(!db)return $("#lt").textContent="Database unavailable.";
 try{const s=await db.collection("results").get();const r=s.docs.map(d=>d.data()).sort((a,b)=>b.score-a.score||a.secs-b.secs);
 const t=["🥇","🥈","🥉"];
 $("#lt").innerHTML=r.length?`<table><tr><th>#</th><th>Name</th><th>WhatsApp</th><th>Score</th><th>Time</th></tr>${r.map((x,i)=>`<tr><td>${t[i]||i+1}</td><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${x.score}/${x.total}</td><td>${fmt(x.secs)}</td></tr>`).join("")}</table>`:"No submissions yet.";}catch(e){$("#lt").textContent="Could not load results."}
}
st=load();home();
(async()=>{try{const u=await claude.use("user");owner=u?await u.isOwner():false;db=await claude.use("db");}catch(e){}home()})();
</script></body></html>
